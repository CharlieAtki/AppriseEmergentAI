name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".pre-commit-config.yaml"
      - "backend/ruff.toml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        run: uvx ruff check backend/

      - name: Ruff format check
        run: uvx ruff format --check backend/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --package apprise-worker --extra test

      - name: Run tests
        run: |
          cd backend
          uv run --package apprise-worker pytest worker/tests/ -v
