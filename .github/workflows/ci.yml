name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".pre-commit-config.yaml"
      - "backend/ruff.toml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install workspace deps
        run: uv sync --all-packages

      - name: Ruff lint
        run: uvx ruff check backend/

      - name: Ruff format check
        run: uvx ruff format --check backend/

      - name: mypy (core)
        run: cd backend && uv run --with mypy mypy core/core/ --ignore-missing-imports

      - name: mypy (api)
        run: cd backend && uv run --with mypy mypy api/api/ --ignore-missing-imports

      - name: mypy (worker)
        run: cd backend && uv run --with mypy mypy worker/worker/ --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Bandit SAST
        run: uvx bandit -r backend/ -ll --exclude backend/core/core/migrations,backend/worker/tests,backend/core/tests

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install worker test deps
        run: uv sync --package apprise-worker --extra test

      - name: Run worker tests
        run: uv run --package apprise-worker pytest backend/worker/tests/ -v

      - name: Install core test deps
        run: uv sync --package apprise-core --extra test

      - name: Run core tests
        run: uv run --package apprise-core pytest backend/core/tests/ -v
