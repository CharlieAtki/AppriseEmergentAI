[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprise-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "apprise-core",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]
