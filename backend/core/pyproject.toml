[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprise-core"
version = "0.1.0"
description = "Shared core library for Apprise"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "sqlalchemy>=2.0",
    "redis>=5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["core"]
