[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprise-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "apprise-core",
    "arq>=0.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.15", "mypy>=2.1"]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.1",
    "pytest-mock>=3.14",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
