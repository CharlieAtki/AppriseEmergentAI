[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apprise-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "apprise-core",
    "arq>=0.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
