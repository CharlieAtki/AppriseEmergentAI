services:

  # ── Infrastructure ──────────────────────────────────────────────────────── #

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ── Application ─────────────────────────────────────────────────────────── #

  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS__URL: redis://redis:6379
      MEMORY__QDRANT_URL: http://qdrant:6333
      ANTHROPIC__API_KEY: ${ANTHROPIC__API_KEY}
      CLERK__SECRET_KEY: ${CLERK__SECRET_KEY}
      CLERK__WEBHOOK_SECRET: ${CLERK__WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    command: >
      sh -c "cd /app/core && alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    environment:
      DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS__URL: redis://redis:6379
      MEMORY__QDRANT_URL: http://qdrant:6333
      ANTHROPIC__API_KEY: ${ANTHROPIC__API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_ vars are browser-accessible — must use localhost, not service names
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # API_URL is server-side only (RSC prefetch) — uses internal Docker service name
      API_URL: http://api:8000
      # Clerk — CLERK__SECRET_KEY (stored once in Doppler / .env) is renamed here to
      # CLERK_SECRET_KEY because @clerk/nextjs expects the single-underscore form.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK__SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    volumes:
      - frontend_next:/app/.next
    develop:
      watch:
        # Sync source changes directly into the container — Compose Watch uses docker cp,
        # bypassing the Windows→WSL2 9P bridge so inotify events work inside the container.
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/next.config.ts
          target: /app/next.config.ts
        - action: sync
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./frontend/postcss.config.mjs
          target: /app/postcss.config.mjs
        # Dependency changes require a full rebuild
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/bun.lock
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  frontend_next:
